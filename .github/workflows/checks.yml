name: CPU artifact checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: environment/requirements-cpu.txt
      - name: Install CPU dependencies
        run: python -m pip install -r environment/requirements-cpu.txt
      - name: Run tests and report skips
        run: python -m pytest -q -rs tests
      - name: Reproduce a small analytical run
        run: |
          python experiments/run_chain.py --workload alexnet --N 64 \
            --baselines dp,dpbest,owt --out "$RUNNER_TEMP/lhas-check" --tag check
          python scripts/check_reproduction.py "$RUNNER_TEMP/lhas-check/check/alexnet_N64.json" \
            --require-baselines dp_N,dp_best,owt --allow-source-change
